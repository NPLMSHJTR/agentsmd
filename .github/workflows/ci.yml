name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pytest
        env:
          PYTHONPATH: src

  dogfood:
    name: verify our own AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: The tool must not report errors on its own repository
        run: python -m agentsmd verify . --no-color
        env:
          PYTHONPATH: src
      - name: A known-bad file must fail
        run: |
          set -e
          mkdir -p /tmp/bad
          printf '# AGENTS.md\n\nInstall with `npm install`.\nSee `src/nope.ts`.\nPlease write clean readable code.\n' > /tmp/bad/AGENTS.md
          cp pyproject.toml /tmp/bad/
          mkdir -p /tmp/bad/src
          if python -m agentsmd verify /tmp/bad --no-color; then
            echo "expected a non-zero exit for a bad file"
            exit 1
          fi
          echo "known-bad file correctly failed"
        env:
          PYTHONPATH: src

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/